name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    env:
      # The e2e tests use an in-memory fake Prisma: no real database is
      # involved in CI. This only needs to be a syntactically valid value
      # because `prisma generate` reads DATABASE_URL from the schema.
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      DIRECT_URL: postgresql://user:pass@localhost:5432/ci
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/backend
      - run: npm test --workspace apps/backend
      - run: npm run test:e2e --workspace apps/backend

  mobile:
    name: Mobile — type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --project apps/mobile/tsconfig.json

  admin:
    name: Admin — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/admin
